plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.logunov.bydsplit'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.logunov.bydsplit'
        minSdk 27
        targetSdk 35
        versionCode 20
        versionName '0.6.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
