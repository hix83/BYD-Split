plugins {
    id 'com.android.application'
}

// Compile against the two OEM listener signatures without shipping replacement framework classes.
def vendorStubs = tasks.register('compileVendorStubs', JavaCompile) {
    source fileTree('src/vendorStubs/java')
    classpath = files(android.bootClasspath)
    destinationDirectory = layout.buildDirectory.dir('vendor-stubs/classes')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
def vendorStubJar = tasks.register('vendorStubJar', Jar) {
    dependsOn vendorStubs
    from vendorStubs.map { it.destinationDirectory }
    archiveFileName = 'vendor-api-stubs.jar'
    destinationDirectory = layout.buildDirectory.dir('vendor-stubs')
}
dependencies { compileOnly files(vendorStubJar) }

android {
    namespace 'ru.logunov.bydsplit'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.logunov.bydsplit'
        minSdk 27
        targetSdk 35
        versionCode 41
        versionName '0.9.6'
        testInstrumentationRunner providers.gradleProperty('testRunner').getOrElse('ru.logunov.bydsplit.StatisticsInstrumentation')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
